{% extends 'base.html' %}

{% block title %}Удаление статьи - {{ post.title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Подтверждение удаления</h4>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить статью "{{ post.title }}"?</p>
                    <p class="text-muted">Это действие нельзя отменить.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Удалить</button>
                            <a href="{% url 'blog_app:blogpost_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
